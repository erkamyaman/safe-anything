[package]
name = "safe-anything"
version = "1.0.2"
edition = "2024"
description = "Find vulnerabilities in any app, and in the AI agent setup that builds it. One fast command, 100% Rust."
license = "MIT"
repository = "https://github.com/erkamyaman/safe-anything"
keywords = ["security", "scanner", "sast", "mcp", "vulnerability"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
