<!doctype html>
<!-- GitHub social preview (1280x640, upload in Settings > Social preview). Render with `sh scripts/social-preview.sh`. -->
<html lang="en"><head><meta charset="utf-8"><title>safe-anything social preview</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { position: relative; background: #07110d; color: #eef6f1;
         font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; }
  .scan { position: absolute; inset: 0;
          background: repeating-linear-gradient(to bottom, rgb(124 245 192 / 0.045) 0 1px, transparent 1px 6px);
          mask-image: radial-gradient(70% 90% at 25% 50%, #000 25%, transparent 80%); }
  .glow { position: absolute; left: -80px; top: 60px; width: 700px; height: 560px;
          background: radial-gradient(45% 45% at 50% 50%, rgb(47 212 143 / 0.45), transparent 72%); filter: blur(10px); }
  .logo { position: absolute; left: 70px; top: 50%; transform: translateY(-50%); width: 430px; border-radius: 48px;
          filter: drop-shadow(0 0 40px rgb(31 175 110 / 0.45)) drop-shadow(0 20px 30px rgb(0 0 0 / 0.6)); }
  .text { position: absolute; left: 560px; right: 50px; top: 50%; transform: translateY(-50%); }
  h1 { font-size: 80px; font-weight: 800; letter-spacing: -2.5px; line-height: 1; }
  h1 em { font-style: normal; color: #2fd48f; }
  .tag { margin-top: 24px; font-size: 35px; font-weight: 700; line-height: 1.15; letter-spacing: -0.6px; }
  .sub { margin-top: 16px; font-size: 21px; line-height: 1.4; color: #a4b8ae; }
  .stats { display: flex; gap: 14px; margin-top: 34px; }
  .stat { flex: 1; padding: 14px 16px; border-radius: 12px; background: rgb(47 212 143 / 0.07); border: 1px solid rgb(47 212 143 / 0.35); }
  .stat b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -0.8px; color: #5ce8ac; }
  .stat small { display: block; margin-top: 4px; font-size: 15px; line-height: 1.3; color: #a4b8ae; }
</style></head><body>
<div class="scan"></div><div class="glow"></div>
<img class="logo" src="logo.png" alt="">
<div class="text">
  <h1>safe-<em>anything</em></h1>
  <p class="tag">Find the holes before someone else does.</p>
  <p class="sub">Code, secrets, mobile, cloud config, dependencies, and the AI agent setup that writes it all. One command.</p>
  <div class="stats">
    <div class="stat"><b>&lt;0.1 s</b><small>for 1,195 files (Juice Shop, M4)</small></div>
    <div class="stat"><b>108 rules</b><small>with CWE and OWASP ids</small></div>
    <div class="stat"><b>100% Rust</b><small>one binary, no runtime</small></div>
  </div>
</div>
</body></html>
