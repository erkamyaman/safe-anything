<VirtualHost *:443>
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
</VirtualHost>
<VirtualHost *:8443>
    SSLProtocol -all +TLSv1.2 +TLSv1.3
</VirtualHost>
<VirtualHost *:9443>
    SSLProtocol all -SSLv3
</VirtualHost>
<VirtualHost *:10443>
    SSLProtocol -all +TLSv1.1 +TLSv1.2
</VirtualHost>
<VirtualHost *:11443>
    SSLProtocol TLSv1 TLSv1.2
</VirtualHost>
<VirtualHost *:12443>
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1 \
        +TLSv1
</VirtualHost>
<VirtualHost *:13443>
    SSLProtocol ${LEGACY} -SSLv3
</VirtualHost>
<VirtualHost *:14443>
    SSLProtocol "all" "-SSLv3" "-TLSv1" "-TLSv1.1"
</VirtualHost>
<VirtualHost *:15443>
    SSLProtocol "-all" "+TLSv1"
</VirtualHost>
